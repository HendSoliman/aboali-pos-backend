# src/main/resources/application.properties
spring.application.name=aboali-pos-backend

# ?? Server ??????????????????????????????????????????????????????
server.port=8080

# ?? PostgreSQL ??????????????????????????????????????????????????
# ? Fixed: use env var placeholders ? never hardcode credentials
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/aboali_pos}
spring.datasource.username=${DB_USERNAME:pos_user}
spring.datasource.password=${DB_PASSWORD:pos_pass_1234}
spring.datasource.driver-class-name=org.postgresql.Driver

# ?? Connection Pool (HikariCP) ???????????????????????????????????
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000

# ?? JPA ?????????????????????????????????????????????????????????
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ?? Flyway ??????????????????????????????????????????????????????
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
# ? Added: Flyway also needs credentials
spring.flyway.url=${DB_URL:jdbc:postgresql://localhost:5432/aboali_pos}
spring.flyway.user=${DB_USERNAME:pos_user}
spring.flyway.password=${DB_PASSWORD:pos_pass_1234}

# ?? Jackson ??????????????????????????????????????????????????????
# ? Jackson 3.x (Spring Boot 4) ? use SCREAMING_SNAKE_CASE keys
#spring.jackson.serialization.WRITE_DATES_AS_TIMESTAMPS=false
#spring.jackson.default-property-inclusion=non_null

# ?? Swagger UI ???????????????????????????????????????????????????
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.enabled=true

# ?? Logging ??????????????????????????????????????????????????????
logging.level.root=INFO
logging.level.com.arabicpos=DEBUG
logging.level.org.flywaydb=INFO
